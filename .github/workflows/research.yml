name: research
on: workflow_dispatch
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy alpaca-py yfinance
      - run: python nasdaq_daytrader.py research
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add passed_daytrade.json
          git commit -m "Research-Ergebnis" || echo "keine Aenderung"
          git push
